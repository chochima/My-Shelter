<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta http-equiv="X-UA-Compatible" content="IE=edge" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <!-- CSS only -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.1/dist/css/bootstrap.min.css" rel="stylesheet"
    integrity="sha384-F3w7mX95PdgyTmZZMECAngseQB83DfGTowi0iMjiWaeVhAn4FJkqJByhZMI3AhiU" crossorigin="anonymous">
  <!-- bootstrap icon -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css">

  <title>login</title>

</head>

<body>
  <%- include('./layout/header'); -%>
    <%- include('./layout/scroll-top-button'); -%>

      <div class="container">
        <div class="row justify-content-center">
          <div class="col-md-6">
            <div class="border border-primary p-8 bg-primary-100 shadow">
              <h3 class="text-center text-primary mb-2">會員登入</h3>
              <div class="">
                <form action="">

                  <div>
                    <!-- 帳號 -->
                    <div class="mb-4">
                      <p class="fs-6 mb-2">帳號</p>
                      <div class="form-floating ">
                        <input type="email" class="form-control" id="account-login" placeholder="登入帳號"
                          aria-describedby="emailHelp">
                        <label for="account-login" class="form-label">電子郵件</label>
                      </div>
                    </div>

                    <!-- 密碼 -->
                    <div class="mb-4">
                      <p class="fs-6 mb-2">密碼</p>
                      <div class="form-floating text-end">
                        <input type="password" class="form-control" id="password-login" placeholder="登入密碼">
                        <label for="password-login">密碼</label>
                        <a href="#" class="fs-8 text-secondary-700">忘記密碼</a>
                      </div>
                    </div>


                    <!-- 快速登入 -->
                    <div class="mb-6">
                      <p class="mb-1 fs-6 text-center text-secondary-700">快速登入</p>
                      <div class="d-flex justify-content-center text-secondary">
                        <a href="#" class="pe-4 fs-4 text-secondary-700"><i class="bi bi-browser-chrome"></i></a>
                        <a href="#" class="pe-4 fs-4 text-secondary-700"><i class="bi bi-facebook"></i></a>
                        <a href="#" class="fs-4 text-secondary-700"><i class="bi bi-line"></i></a>
                      </div>
                    </div>



                    <div class="d-grid text-center">
                      <button type="button" class="btn border btn-primary fs-6 py-3 "> 登入 </button>
                      <a href="#" class="fs-8 text-secondary-700">還沒有帳戶？點擊此處註冊</a>
                    </div>

                  </div>
              </div>

              </form>

            </div>

          </div>
        </div>
      </div>
      </div>

      <%- include('./layout/footer'); -%>
        <!-- JavaScript Bundle with Popper -->
        <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.1.1/dist/js/bootstrap.bundle.min.js"
          integrity="sha384-/bQdsTh/da6pkI1MST/rWKFNjaCP5gBSY4sEBT38Q/9RBh9AH40zEOg7Hlq2THRZ"
          crossorigin="anonymous"></script>
        <script type="module" src="../main.js"></script>
</body>

</html>
