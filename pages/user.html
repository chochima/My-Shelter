<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta http-equiv="X-UA-Compatible" content="IE=edge" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <!-- CSS only -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.1/dist/css/bootstrap.min.css" rel="stylesheet"
    integrity="sha384-F3w7mX95PdgyTmZZMECAngseQB83DfGTowi0iMjiWaeVhAn4FJkqJByhZMI3AhiU" crossorigin="anonymous">
  <!-- bootstrap icon -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css">

  <title>user</title>
  <style>


    .user-right-content {
      max-height: 640px;
      /* 要限制的高度 */
      overflow-y: auto;
      /* 超過就顯示直向卷軸 */
      padding: 24px;
    }

    .user-left-list:hover {
      background-color: #fff;
    }
  </style>
</head>

<body>
  <%- include('./layout/header'); -%>
    <%- include('./layout/scroll-top-button'); -%>

      <div class="bg-primary-200">
        <div class="container py-8">

          <div class="row">
            <!-- 左側選單 -->
            <div class="col-md-4 ">
              <div class="nav flex-column nav-pills" id="v-pills-tab" role="tablist" aria-orientation="vertical">

                <div class="d-flex align-items-center justify-content-space p-7  bg-light gap-6 mb-4">
                  <img src="/assets/images/dog.jpg" alt="user avatar" class=" me-3 shadow"
                    style="width:150px; height: 150px; object-fit: cover;">
                  <div class="text-center">
                    <h4 class="mb-2">使用者名稱</h4>
                    <p class="mb-0 text-muted fs-8">LV.5 銀牌守護者</p>
                  </div>
                </div>

                <button class="nav-link active fs-5 rounded-0 p-4 user-left-list" id="v-pills-user-tab"
                  data-bs-toggle="pill" data-bs-target="#v-pills-user" type="button" role="tab"
                  aria-controls="v-pills-user" aria-selected="true">個人資訊</button>
                <button class="nav-link fs-5 rounded-0 p-4 user-left-list" id="v-pills-messages-tab"
                  data-bs-toggle="pill" data-bs-target="#v-pills-messages" type="button" role="tab"
                  aria-controls="v-pills-messages" aria-selected="false">通知訊息</button>
                <button class="nav-link fs-5 rounded-0 p-4 user-left-list" id="v-pills-orders-tab" data-bs-toggle="pill"
                  data-bs-target="#v-pills-orders" type="button" role="tab" aria-controls="v-pills-orders"
                  aria-selected="false">訂單資訊</button>
                <button class="nav-link fs-5 rounded-0 p-4 user-left-list  mb-4" id="v-pills-follow-tab"
                  data-bs-toggle="pill" data-bs-target="#v-pills-follow" type="button" role="tab"
                  aria-controls="v-pills-follow" aria-selected="false">我的關注</button>
              </div>
            </div>
            <!-- 左側選單 -->

            <!-- 右側選單 -->
            <div class="col-md-8">
              <div class="tab-content user-right-content" id="v-pills-tabContent">

                <!-- 個人資訊 -->
                <div class="tab-pane fade show active" id="v-pills-user" role="tabpanel"
                  aria-labelledby="v-pills-user-tab" tabindex="0">
                  <h4 class="mb-7">個人資訊</h4>
                  <div>
                    <form action="">
                      <!-- 使用者名稱 -->
                      <div class="mb-4">
                        <label for="userName" class="form-label fs-7 mb-2">使用者名稱</label>
                        <input type="text" class="form-control w-auto" id="userName" placeholder="使用者名稱" value="使用者名稱">
                      </div>
                      <!-- 密碼 -->
                      <div class="mb-4">
                        <label for="userPassword" class="form-label fs-7 mb-2">密碼</label>
                        <div class="d-flex align-items-center">
                          <input type="password" class="form-control w-auto me-6" id="userPassword" placeholder="密碼" value="********">
                          <a href="#" class="text-info fs-8">修改密碼</a>
                        </div>
                      </div>
                      <!-- email(唯獨) -->
                      <div class="mb-4">
                        <label for="userEmail" class="form-label fs-7 mb-2">email 信箱</label>
                        <input type="email" class="form-control-plaintext w-auto" id="userEmail" placeholder="用戶信箱"
                          value="email@example.com" readonly>
                      </div>
                      <!-- 手機 -->
                      <div class="mb-4">
                        <label for="userPhone" class="form-label fs-7 mb-2">手機</label>
                        <input type="tel" class="form-control w-auto" id="userPhone" placeholder="手機號碼"
                          value="09xx-xxxxxx">
                      </div>
                      <!-- 生日 -->
                      <div class="mb-4">
                        <label for="userBirth" class="form-label fs-7 mb-2">生日</label>
                        <input type="date" class="form-control w-auto" id="userBirth">
                      </div>
                      <!-- 儲存按鈕 -->
                      <div class="text-end">
                        <button type="submit" class="btn btn-info px-6 text-light rounded-1 me-80 ">確認儲存</button>
                      </div>
                    </form>
                  </div>
                </div>

                <!-- 通知訊息 -->
                <div class="tab-pane fade" id="v-pills-messages" role="tabpanel" aria-labelledby="v-pills-messages-tab"
                  tabindex="0">
                  <h4>通知訊息</h4>
                  <p>這裡放通知訊息。</p>
                </div>

                <!-- 訂單資訊 -->
                <div class="tab-pane fade" id="v-pills-orders" role="tabpanel" aria-labelledby="v-pills-orders-tab"
                  tabindex="0">
                  <h4>訂單資訊</h4>
                  <p>這裡放訂單紀錄。</p>
                </div>

                <!-- 我的關注 -->
                <div class="tab-pane fade" id="v-pills-follow" role="tabpanel" aria-labelledby="v-pills-follow-tab"
                  tabindex="0">
                  <h4>我的關注</h4>
                  <p>這裡放關注機構／寶貝。</p>
                </div>

              </div>
            </div>
            <!-- 右側選單 -->


          </div>
        </div>

      </div>









      <%- include('./layout/footer'); -%>
        <!-- JavaScript Bundle with Popper -->
        <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.1.1/dist/js/bootstrap.bundle.min.js"
          integrity="sha384-/bQdsTh/da6pkI1MST/rWKFNjaCP5gBSY4sEBT38Q/9RBh9AH40zEOg7Hlq2THRZ"
          crossorigin="anonymous"></script>
        <script type="module" src="../main.js"></script>
</body>

</html>
