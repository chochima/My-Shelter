<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta http-equiv="X-UA-Compatible" content="IE=edge" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <!-- CSS only -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.1/dist/css/bootstrap.min.css" rel="stylesheet"
    integrity="sha384-F3w7mX95PdgyTmZZMECAngseQB83DfGTowi0iMjiWaeVhAn4FJkqJByhZMI3AhiU" crossorigin="anonymous">
  <!-- bootstrap icon -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css">

  <title>註冊</title>

</head>

<body>
  <%- include('./layout/header'); -%>
      <div class="bg-primary-200">

        <div class="container py-8">
          <div class="row justify-content-center my-3">
            <div class="col-md-8 col-lg-6">


              <div class="border border-primary p-64 bg-primary-100 shadow"><!-- 登入區塊外框底色設定 -->

                <h4 class="text-center text-primary mb-2">加入會員</h4>

                <div class=""> <!--以下是form表單-->

                  <form action="">

                    <!-- 使用者名稱 -->
                    <div class="mb-4">
                      <p class="mb-2">使用者名稱<span class="badge register-badge">必填</span></p>
                      <div class="form-floating ">
                        <input type="text" class="form-control" id="register-username" placeholder="使用者名稱"
                          aria-describedby="usernameHelp">
                        <label for="register-username" class="form-label fs-8">使用者名稱</label>
                      </div>
                    </div>
                    <!-- 使用者名稱 -->

                    <!-- email -->
                    <div class="mb-4">
                      <p class="mb-2">email 信箱<span class="badge register-badge">必填</span></p>
                      <div class="form-floating ">
                        <input type="email" class="form-control" id="register-email" placeholder="註冊email"
                          aria-describedby="emailHelp">
                        <label for="register-email" class="form-label fs-8">電子郵件</label>
                      </div>
                    </div>
                    <!-- email -->

                    <!-- 密碼 -->
                    <div class="mb-64">
                      <p class=" mb-2">密碼<span class="badge register-badge">必填</span></p>
                      <div class="form-floating text-end">
                        <input type="password" class="form-control" id="register-password" placeholder="註冊密碼">
                        <label for="register-password" class="form-label fs-8"> 英數混合且長度為6~12字元</label>
                      </div>
                    </div>
                    <!-- 密碼 -->

                    <!-- 註冊按鈕 -->
                    <div class="d-grid text-center mb-6">
                      <button type="button" class="btn border btn-primary fs-6 py-3 mb-2" data-bs-toggle="modal"
                        data-bs-target="#registerSuccessModal"> 註冊 </button>
                      <p class="fs-8 text-secondary">註冊即同意接受 <a href="#" class="text-secondary underline-link">服務條款</a> 及 <a href="#"
                          class="text-secondary underline-link">隱私權政策</a></p>
                    </div>
                    <!-- 註冊按鈕 -->

                    <!-- 快速登入 -->
                    <div class="mb-64">
                      <p class="mb-1 fs-7 text-center text-secondary-800">快速登入</p>
                      <div class="d-flex justify-content-center text-secondary">
                        <a href="#" class="pe-4 fs-4 text-secondary"><i class="bi bi-browser-chrome fastLogin"></i></a>
                        <a href="#" class="pe-4 fs-4 text-secondary"><i class="bi bi-facebook fastLogin"></i></a>
                        <a href="#" class="fs-4 text-secondary"><i class="bi bi-line fastLogin"></i></a>
                      </div>
                    </div>
                    <!-- 快速登入 -->

                    <p class="text-center">
                      <a href="./login.html" class="text-secondary underline-link">已經是會員？ 前往登入 </a>
                    </p>




                    <!-- Button trigger modal -->
                    <!-- Modal 彈出視窗-->
                    <div class="modal fade" id="registerSuccessModal" tabindex="-1"
                      aria-labelledby="registerSuccessModalLabel" aria-hidden="true">
                      <div class="modal-dialog">
                        <div class="modal-content">
                          <div class="modal-header">
                            <h1 class="modal-title fs-5" id="registerSuccessModalLabel">註冊成功</h1>
                            <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
                          </div>
                          <div class="modal-body">
                            恭喜您完成註冊！
                          </div>
                          <div class="modal-footer">
                            <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">確定</button>
                          </div>
                        </div>
                      </div>
                    </div>
                    <!-- Modal 彈出視窗-->

                  </form>

                </div> <!--form表單結束-->

              </div><!-- 登入區塊外框底色設定 -->


            </div>
          </div>
        </div>

      </div>

      <%- include('./layout/footer'); -%>
      <%- include('./layout/scroll-top-button'); -%>
        <!-- JavaScript Bundle with Popper -->
        <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.1.1/dist/js/bootstrap.bundle.min.js"
          integrity="sha384-/bQdsTh/da6pkI1MST/rWKFNjaCP5gBSY4sEBT38Q/9RBh9AH40zEOg7Hlq2THRZ"
          crossorigin="anonymous"></script>
        <script type="module" src="../main.js"></script>
</body>

</html>
